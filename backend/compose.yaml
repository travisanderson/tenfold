# Local Postgres for development and tests. Production uses Supabase.
# Port 54329 keeps clear of any Postgres already on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tenfold
      POSTGRES_PASSWORD: tenfold
      POSTGRES_DB: tenfold
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenfold"]
      interval: 2s
      timeout: 2s
      retries: 20

name: contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lints the spec, regenerates Go and TS types, and fails on any diff.
      - run: make check-drift
      - run: cd backend && go build ./... && go vet ./...
      # Tests that need the database or the generated samples skip here;
      # neither is in the repo. Run those by hand, as backend/README.md says.
      - run: cd backend && go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
